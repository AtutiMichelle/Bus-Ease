@if (card(); as data) {
  <div class="kpi-card" [class]="'tone-' + data.tone">
    <div class="kpi-top">
      <p class="kpi-label">{{ data.label }}</p>
      @if (sparklinePoints()) {
        <svg class="kpi-sparkline" viewBox="0 0 100 30" role="img" [attr.aria-label]="sparklineDescription()">
          <polyline
            [attr.points]="sparklinePoints()"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
    </div>

    <p class="kpi-value">{{ data.value }}</p>

    <p class="kpi-delta" [class]="'delta-' + data.delta.direction">
      @if (data.delta.direction === 'up') {
        <span aria-hidden="true">&uarr;</span>
      } @else if (data.delta.direction === 'down') {
        <span aria-hidden="true">&darr;</span>
      }
      {{ data.delta.text }}
    </p>
  </div>
} @else if (loading()) {
  <div class="kpi-card kpi-skeleton" aria-hidden="true">
    <span class="skeleton sk-label"></span>
    <span class="skeleton sk-value"></span>
    <span class="skeleton sk-delta"></span>
  </div>
}
