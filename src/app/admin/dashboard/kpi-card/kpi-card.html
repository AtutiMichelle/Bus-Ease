<div class="kpi-card" [class]="'tone-' + tone()">
  <div class="kpi-top">
    <p class="kpi-label">{{ label() }}</p>
    @if (sparklinePoints()) {
      <svg class="kpi-sparkline" viewBox="0 0 100 30" role="img" [attr.aria-label]="sparklineDescription()">
        <polyline
          [attr.points]="sparklinePoints()"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  </div>

  <p class="kpi-value">{{ value() }}</p>

  <p class="kpi-delta" [class]="'delta-' + delta().direction">
    @if (delta().direction === 'up') {
      <span aria-hidden="true">&uarr;</span>
    } @else if (delta().direction === 'down') {
      <span aria-hidden="true">&darr;</span>
    }
    {{ delta().text }}
  </p>
</div>
