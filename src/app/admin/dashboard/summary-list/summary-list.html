<section class="summary-card admin-card" aria-labelledby="week-title">
  <div class="admin-card-header">
    <div class="admin-card-heading">
      <h2 id="week-title" class="admin-card-title">Summary</h2>
    </div>
  </div>

  @let current = state();
  <div class="admin-card-body">
    @if (current.status === 'error') {
      <app-widget-error message="Couldn't load the summary." (retry)="retry.emit()" />
    } @else if (current.status === 'loading') {
      <div class="week-list" aria-hidden="true">
        @for (slot of placeholders; track slot) {
          <div class="week-row">
            <span class="skeleton sk-label"></span>
            <span class="skeleton sk-value"></span>
          </div>
        }
      </div>
    } @else {
      <dl class="week-list">
        @for (row of rows(); track row.label) {
          <div class="week-row">
            <dt>
              <app-admin-icon class="row-icon" [paths]="icons[rowIcon[row.label] ?? 'chart']" />
              <span class="row-label">{{ row.label }}</span>
            </dt>
            <dd>{{ row.value }}</dd>
          </div>
        }
      </dl>
    }
  </div>
</section>
