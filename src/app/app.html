@if (!isAdminRoute()) {
  <app-header />
  <app-voice-scrim class="header-voice-scrim" [visible]="voiceDimsHeader()" />
}

<main [class.no-header-offset]="isAdminRoute()">
  <router-outlet />
</main>

@if (!isAdminRoute()) {
  <app-footer />
}

@if (voiceDockVisible()) {
  <app-voice-dock />
}

@if (voiceDemo) {
  <app-voice-demo />
}

@if (authModal.mode()) {
  <app-auth-modal />
}
