<aside class="filter-panel">
  <div class="filter-panel-header">
    <h2>Filters</h2>
    <button type="button" class="clear-all" (click)="clearAll()">Clear all</button>
  </div>

  <section class="filter-section">
    <p class="filter-section-label">Seat type</p>
    <div class="checkbox-list">
      @for (seatType of seatTypeOptions; track seatType) {
        <label class="checkbox-row">
          <span class="checkbox-row-main">
            <input
              type="checkbox"
              [checked]="selectedSeatTypes().has(seatType)"
              (change)="toggleSeatType(seatType)"
            />
            {{ seatType }}
          </span>
          <span class="checkbox-row-count">{{ seatTypeCounts().get(seatType) ?? 0 }}</span>
        </label>
      }
    </div>
  </section>

  <section class="filter-section">
    <p class="filter-section-label">Departure time</p>
    <div class="tile-grid">
      @for (zone of departureZones; track zone.period) {
        <button
          type="button"
          class="filter-tile"
          [class.active]="selectedDepartureTimes().has(zone.period)"
          [attr.aria-pressed]="selectedDepartureTimes().has(zone.period)"
          (click)="toggleDepartureTime(zone.period)"
        >
          <i class="fa-solid {{ zone.icon }}" aria-hidden="true"></i>
          <span>{{ zone.period }}</span>
        </button>
      }
    </div>
  </section>

  <section class="filter-section">
    <p class="filter-section-label">Amenities</p>
    <div class="tile-grid">
      @for (zone of amenityZones; track zone.amenity) {
        <button
          type="button"
          class="filter-tile"
          [class.active]="selectedAmenities().has(zone.amenity)"
          [attr.aria-pressed]="selectedAmenities().has(zone.amenity)"
          (click)="toggleAmenity(zone.amenity)"
        >
          <i class="fa-solid {{ zone.icon }}" aria-hidden="true"></i>
          <span>{{ zone.label }}</span>
        </button>
      }
    </div>
  </section>

  <section class="filter-section">
    <p class="filter-section-label">Bus type</p>
    <div class="checkbox-list">
      @for (busType of options().busTypes; track busType) {
        <label class="checkbox-row">
          <span class="checkbox-row-main">
            <input
              type="checkbox"
              [checked]="selectedBusTypes().has(busType)"
              (change)="toggleBusType(busType)"
            />
            {{ busType }}
          </span>
          <span class="checkbox-row-count">{{ busTypeCounts().get(busType) ?? 0 }}</span>
        </label>
      }
    </div>
  </section>

  <section class="filter-section">
    <p class="filter-section-label">Bus partner</p>
    <select class="operator-select" [ngModel]="selectedOperator() ?? ''" (ngModelChange)="setOperator($event)">
      <option value="">All partners</option>
      @for (operator of options().operators; track operator) {
        <option [value]="operator">{{ operator }} ({{ operatorCounts().get(operator) ?? 0 }})</option>
      }
    </select>
  </section>
</aside>
