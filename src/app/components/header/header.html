<header class="site-header">
  <a routerLink="/" class="logo"><i class="fa-solid fa-bus logo-icon" aria-hidden="true"></i>BusEase</a>

  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Menu"
  >
    <i class="fa-solid" [class.fa-bars]="!menuOpen()" [class.fa-xmark]="menuOpen()" aria-hidden="true"></i>
  </button>

  <div class="nav-group" [class.nav-group-open]="menuOpen()">
    <nav>
      <a routerLink="/" (click)="closeMenu()">Home</a>
      <a routerLink="/" fragment="about" (click)="closeMenu()">About</a>
      <a routerLink="/account" (click)="closeMenu()">My Bookings</a>
      <a routerLink="/contact" (click)="closeMenu()">Contact</a>
    </nav>

    @if (authService.user(); as user) {
      <div class="user-menu">
        <button
          type="button"
          class="user-name"
          (click)="toggleUserMenu()"
          aria-haspopup="menu"
          [attr.aria-expanded]="userMenuOpen()"
        >
          <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
          {{ authService.displayName() }}
          <i class="fa-solid fa-chevron-down user-name-caret" aria-hidden="true"></i>
        </button>
        @if (userMenuOpen()) {
          <div class="user-dropdown" role="menu">
            @if (staff.homeLink(); as home) {
              <a [routerLink]="home.route" role="menuitem" (click)="closeMenu()">
                <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                {{ home.label }}
              </a>
            } @else {
              <a routerLink="/account" [queryParams]="{ tab: 'profile' }" role="menuitem" (click)="closeMenu()">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                Profile
              </a>
            }
            <button type="button" role="menuitem" (click)="logout()">
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
              Logout
            </button>
          </div>
        }
      </div>
    } @else {
      <button type="button" class="auth-cta" (click)="authModal.open('login'); closeMenu()">
        <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
        Login
      </button>
    }
  </div>
</header>
