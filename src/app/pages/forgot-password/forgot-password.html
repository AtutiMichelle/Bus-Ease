<section class="page-header">
  <div class="section-container">
    <h1>Forgot Password</h1>
    <p>We'll email you a link to reset it.</p>
  </div>
</section>

<section class="forgot-content">
  <div class="section-container">
    <div class="forgot-card">
      @if (submitted()) {
        <div class="success-state">
          <i class="fa-solid fa-envelope-circle-check" aria-hidden="true"></i>
          <h2>Check Your Email</h2>
          <p>If an account exists for {{ email() }}, we've sent a link to reset your password.</p>
          <a routerLink="/" class="submit-cta">Back to Home</a>
        </div>
      } @else {
        <form (ngSubmit)="submit()">
          <div class="field">
            <label for="fp-email">Email</label>
            <input
              id="fp-email"
              type="email"
              placeholder="you@example.com"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              required
            />
          </div>

          @if (error()) {
            <p class="error">{{ error() }}</p>
          }

          <button type="submit" class="submit-cta" [disabled]="!canSubmit">
            {{ submitting() ? 'Sending…' : 'Send Reset Link' }}
          </button>
        </form>
      }
    </div>
  </div>
</section>
